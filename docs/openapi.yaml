openapi: 3.0.3
info:
  title: Ketab-Yar API
  description: Public & Authenticated REST API for Ketab-Yar Bilingual Reading Platform
  version: 1.0.0
paths:
  /api/books:
    get:
      summary: Fetch catalog books with filtering, sorting, and cursor pagination
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query matching title, description, or author
        - name: genre
          in: query
          schema:
            type: string
          description: Filter by genre slug
        - name: level
          in: query
          schema:
            type: string
          description: CEFR difficulty level (A1, A2, B1, B2, C1, C2)
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, rating, views, title, year]
          default: recent
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of matching books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookListItem'
  /api/account/export:
    get:
      summary: Export all data associated with current user/guest (GDPR SAR)
      responses:
        '200':
          description: Complete user data JSON file
components:
  schemas:
    BookListItem:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        author:
          type: string
        rating:
          type: number
        reviewCount:
          type: integer
        genres:
          type: array
          items:
            type: string
